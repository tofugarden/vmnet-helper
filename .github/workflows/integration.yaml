---
name: Integration

on:
  workflow_call:  # Can be called from other workflows

permissions:
  contents: read

jobs:
  example:
    name: Example
    # macos-26 (arm64) is using M1 cpu but nested virtualization require M3 or
    # later.
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        driver: [vfkit, qemu]
        connection: [fd, socket, runner]
        exclude:
          - driver: qemu
            connection: socket
    steps:
      - name: Host info
        run: |
          uname -a
          sw_vers
          ifconfig
      - name: Disable spotlight indexing
        run: |
          # Disable indexing globally
          sudo mdutil -a -i off
          # Erase Existing Indexes
          sudo mdutil -E /
      - name: Install requirements
        run: brew install qemu cdrtools coreutils tree
      - name: Inspect qemu
        # Looking up both prefixes to make it eaier to port to arm64 in the future.
        run: |
          tree -h /usr/local/share/qemu || true
          tree -h /opt/homebrew/share/qemu || true
      - name: Install vfkit
        if: matrix.driver == 'vfkit'
        run: brew install vfkit
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: vmnet-helper.tar.gz
      - name: Install vmnet-helper
        run: VMNET_INTERACTIVE=0 ./install.sh vmnet-helper.tar.gz
      - name: Print version
        run: /opt/vmnet-helper/bin/vmnet-helper --version
      - name: Ensure public key
        run: |
          ssh-keygen -q -N "" </dev/zero
      - name: Configure ssh
        run: |
          echo "Include ~/.vmnet-helper/vms/*/ssh.config" >> ~/.ssh/config
      - name: Create virtual env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyyaml
      - name: Flush mDNS cache
        run: |
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder
      - name: Start example VM
        run: |
          # NOTE: Run as root to allow mDNS resolution and checking guest
          # connectivity.  macOS Local Network Privacy blocks local network
          # access for non-root processes outside Terminal.
          sudo --preserve-env HOME=$HOME .venv/bin/python3 ./run test \
              --driver ${{ matrix.driver }} \
              --connection ${{ matrix.connection }} \
              --timeout 300 \
              --verbose &
          pid=$!
          echo $pid > test.pid
          if ! timeout 300s bash -c "until nc -z test-vmnet-helper.local 22 2>/dev/null; do true; done"; then
              echo >&2 "Timeout waiting for test-vmnet-helper.local"
              exit 1
          fi
      - name: Inspect VM host data
        if: always()
        run: |
          tree -h -D --timefmt '%Y-%m-%d %H:%M:%S' ~/.vmnet-helper
          vm="$HOME/.vmnet-helper/vms/test"
          vm_files=$(find "$vm" -name "*.command" -or -name "*.log")
          for f in $vm_files; do
            echo "==> $f <=="
            sudo head -n 500 "$f" || true
          done
          echo "==> /var/db/dhcpd_leases <=="
          ls -l /var/db/dhcpd_leases || true
          sudo head -n 500 /var/db/dhcpd_leases || true
      - name: Inspect VM guest data
        run: |
          echo "uname: $(ssh test -- uname -a)"
          echo "cmdline: $(ssh test -- cat /proc/cmdline)"
      - name: Prepare example VM
        run: |
          ssh test -- sudo apt-get update -y
          ssh test -- sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iperf3
          ssh test -- sudo systemctl start iperf3.service
          echo "Waiting for iperf3 server ..."
          ssh test -- bash -s << EOF
            if ! timeout 10s bash -c "until ss -tln | grep -q :5201; do sleep 1; done"; then
              echo >&2 "Timeout waiting for iperf3 port"
              exit 1
            fi
          EOF
          echo "iperf3 server is ready"
      - name: Run iperf3 (host to vm)
        run: |
          iperf3-darwin -c test-vmnet-helper.local
      - name: Run iperf3 (vm to host)
        run: |
          iperf3-darwin -c test-vmnet-helper.local --reverse
      - name: Terminate example VM
        run: |
          pid=$(cat test.pid)
          echo "Terminating example (pid $pid)"
          sudo kill $pid
          echo "waiting for termination"
          for n in $(seq 20); do
              if ! sudo kill -s 0 $pid; then
                  echo "example terminated ($n/20)"
                  exit 0
              fi
              sleep 1
          done
          echo "timeout terminating example" >&2
          exit 1
      - name: Collect logs
        if: always()
        run: |
          vm="$HOME/.vmnet-helper/vms/test"
          find "$vm" -maxdepth 1 -type f \
              -not -name "*.img" \
              -not -name "*.iso" \
              -not -name "kernel" \
              -not -name "initrd" \
              > artifacts.txt
          test -f /var/db/dhcpd_leases && echo /var/db/dhcpd_leases >> artifacts.txt
          sudo tar --create --gzip \
              --file vmnet-helper-integration-${{ matrix.driver }}-${{ matrix.connection }}.tar.gz \
              --files-from artifacts.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vmnet-helper-integration-${{ matrix.driver }}-${{ matrix.connection }}
          path: vmnet-helper-integration-${{ matrix.driver }}-${{ matrix.connection }}.tar.gz
          compression-level: 0

  network_id:
    name: Network ID
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        driver: [vfkit, qemu]
        connection: [fd, socket]
        exclude:
          - driver: qemu
            connection: socket
    env:
      shared_network_id: c04ad4ac-5e49-4774-a5c9-86f5101b54d4
      isolated_network_id: e72bdf39-b477-47fe-b449-62bc2da53e08
      vm_cmd: |
        .venv/bin/python3 ./run $vm \
            --driver ${{ matrix.driver }} \
            --connection ${{ matrix.connection }} \
            --operation-mode host \
            --network-id $network_id \
            --timeout 300 \
            --verbose &
        pid=$!
        echo $pid > $vm.pid
        network_config=$HOME/.vmnet-helper/vms/$vm/network-config
        timeout 180s bash -c "until test -e $network_config 2>/dev/null; do sleep 5; done"
        vm_ip=$(yq -r '.ethernets.eth0.addresses[0]' $network_config | cut -d '/' -f 1)
        echo "${vm}_ip=$vm_ip" >> $GITHUB_ENV
      vm_wait_cmd: |
        if ! timeout 300s bash -c \
            "until nc -z $(eval "echo \$${vm}_ip") 22 2>/dev/null; do sleep 5; done"
        then
            echo >&2 "Timeout waiting for $test0_ip"
            exit 1
        fi
    steps:
      - name: Host info
        run: |
          uname -a
          sw_vers
          ifconfig
      - name: Disable spotlight indexing
        run: |
          # Disable indexing globally
          sudo mdutil -a -i off
          # Erase Existing Indexes
          sudo mdutil -E /
      - name: Install requirements
        run: brew install qemu cdrtools coreutils tree
      - name: Inspect qemu
        # Looking up both prefixes to make it eaier to port to arm64 in the future.
        run: |
          tree -h /usr/local/share/qemu || true
          tree -h /opt/homebrew/share/qemu || true
      - name: Install vfkit
        if: matrix.driver == 'vfkit'
        run: brew install vfkit
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: vmnet-helper.tar.gz
      - name: Install vmnet-helper
        run: VMNET_INTERACTIVE=0 ./install.sh vmnet-helper.tar.gz
      - name: Print version
        run: /opt/vmnet-helper/bin/vmnet-helper --version
      - name: Ensure public key
        run: |
          ssh-keygen -q -N "" </dev/zero
      - name: Configure ssh
        run: |
          echo "Include ~/.vmnet-helper/vms/*/ssh.config" >> ~/.ssh/config
      - name: Create virtual env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyyaml
      - name: Flush mDNS cache
        run: |
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder
      - name: Start VM test0
        env:
          vm: test0
          network_id: ${{ env.shared_network_id }}
        run: |
          ${{ env.vm_cmd }}
      - parallel:
          - name: Wait for VM test0
            env:
              vm: test0
            run: ${{ env.vm_wait_cmd }}
          - name: Start VM test1
            env:
              vm: test1
              network_id: ${{ env.shared_network_id }}
            run: |
              ${{ env.vm_cmd }}
              ${{ env.vm_wait_cmd }}
          - name: Start VM test2
            env:
              vm: test2
              network_id: ${{ env.isolated_network_id }}
            run: |
              ${{ env.vm_cmd }}
              ${{ env.vm_wait_cmd }}
      - name: Ping from test0 to test1
        run: ssh -o StrictHostKeyChecking=no ubuntu@$test0_ip ping -t 10 -c 5 $test1_ip
      - name: ping from test1 to test2
        run: |
          if ! ssh -o StrictHostKeyChecking=no ubuntu@$test1_ip ping -t 10 -c 5 $test2_ip; then
              exit 0
          fi
      - name: Terminate all VMs
        run: |
          echo "Terminating all VMs"
          for vm in test0 test1 test2; do
              kill $(cat $vm.pid)
              echo "waiting for termination"
              for n in $(seq 20); do
                  if ! sudo kill -s 0 $(cat $vm.pid); then
                      echo "example terminated ($n/20)"
                      exit 0
                  fi
                  sleep 1
              done
              echo "timeout terminating $vm" >&2
              exit 1
          done
      - name: Collect logs
        if: always()
        run: |
          find $HOME/.vmnet-helper/vms/test* -maxdepth 1 -type f \
              -not -name "*.img" \
              -not -name "*.iso" \
              -not -name "kernel" \
              -not -name "initrd" \
              > artifacts.txt
          sudo tar --create --gzip \
              --file vmnet-helper-integration-network-id-${{ matrix.driver }}-${{ matrix.connection }}.tar.gz \
              --files-from artifacts.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vmnet-helper-integration-network-id-${{ matrix.driver }}-${{ matrix.connection }}
          path: vmnet-helper-integration-network-id-${{ matrix.driver }}-${{ matrix.connection }}.tar.gz
          compression-level: 0
